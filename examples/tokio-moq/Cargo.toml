[package]
name = "tokio-moq"
version = "2026.0.0"
edition = "2024"
# 依存の s2n-quic が MSRV 1.95 を要求するため、それに合わせる
rust-version = "1.95"
publish = false

[dependencies]
# 時雨堂クレート

# HTTP/2 / WebTransport over HTTP/2 クライアント
shiguredo_http2 = "2026.1.0-canary.16"
# HTTP/3 / WebTransport over HTTP/3 クライアント
shiguredo_http3 = "2026.1.0-canary.9"
# MoQT 本体 (ローカル参照)
shiguredo_moqt = { path = "../../" }

# 外部クレート

# Base64 デコード (MSF fragment の c4m パラメータ)
base64ct = "1.8"
# バイト列操作
bytes = "1.12"
# TLS バックエンド (s2n-quic provider と WebTransport over HTTP/2 の rustls で使う)
rustls = "0.23"
# QUIC クライアント
s2n-quic = { version = "1.90", default-features = false, features = ["provider-address-token-default", "provider-tls-rustls", "unstable-provider-datagram"] }
# 非同期ランタイム
tokio = { version = "1.53", features = ["full"] }
# Tokio タスクメトリクス計測
tokio-metrics = "0.5"
# TLS ストリームの Tokio 統合 (WebTransport over HTTP/2 の TCP+TLS)
tokio-rustls = "0.26"
# ログ出力
tracing = "0.1"

[dev-dependencies]
# 結合テスト用の自己署名証明書生成 (暗号バックエンドは aws-lc-rs)
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs"] }
