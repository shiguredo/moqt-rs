[package]
name = "moq-sub"
version = "2026.0.0"
edition = "2024"
# 依存の s2n-quic が MSRV 1.95 を要求するため、それに合わせる
rust-version = "1.95"
publish = false

[dependencies]
# 時雨堂クレート

# AV1 デコーダ (dav1d)
shiguredo_dav1d = "2026.3"
# HTTP/3 / WebTransport クライアント
shiguredo_http3 = "2026.1.0-canary.9"
# VP8 / VP9 デコーダ (libvpx)
shiguredo_libvpx = "2026.1"
# MOQT 本体 (ローカル参照)
shiguredo_moqt = { path = "../../" }
# MP4 mux (録画)
shiguredo_mp4 = "2026.5"
# Opus デコーダ
shiguredo_opus = "2026.4"

# examples 共有トランスポート crate (QUIC / WebTransport)
tokio-moq = { path = "../tokio-moq" }

# 外部クレート

# バイト列操作
bytes = "1.12"
# CLI 引数パース
noargs = "0.4"
# 映像プレイヤー (メインスレッド実行)
raw_player = "2026.2"
# QUIC クライアント
s2n-quic = { version = "1.90", default-features = false, features = ["provider-address-token-default", "provider-tls-rustls", "unstable-provider-datagram"] }
# 非同期ランタイム
tokio = { version = "1.53", features = ["full"] }
# Tokio タスクメトリクス計測
tokio-metrics = "0.5"
# 非同期ユーティリティ (graceful shutdown, rate limit, pool)
tokio-utils = "0.1"
# ログ出力
tracing = "0.1"
# ログのフィルタリングと購読
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "macos")'.dependencies]
# AAC-LC デコーダ (Apple Audio Toolbox)
# 2026.1.0 は 1 回の AudioConverterFillComplexBuffer で同じパケットを再入力する不具合があり、
# 音声が重複するため、修正が入った canary を使う
shiguredo_audio_toolbox = "2026.2.0-canary.2"
# H.264 / H.265 ハードウェアデコーダ (Apple Video Toolbox)
# 2026.1.1 は NV12 入力の UV プレーンの大きさをバイト数とピクセル数で比較する不具合があり、
# 同じ workspace の moq-pub のエンコードが失敗するため、修正が入った canary を使う
# (workspace では shiguredo_video_toolbox が 1 つのバージョンに解決される)
shiguredo_video_toolbox = "2026.2.0-canary.4"
