[package]
name = "pbt"
version = "0.0.0"
edition = "2024"
rust-version = "1.93"
publish = false

[dependencies]
# Property-Based Testing
noprop = "0.2"
# MOQT 本体 (ローカル参照)
# COSE Key Thumbprint (RFC 9679) の property テストで実 SHA-256 を使う
shiguredo_moqt = { path = "..", features = ["aws-lc-rs"] }

[dev-dependencies]
# integration test は lib 経由で使うため dev 依存は不要
