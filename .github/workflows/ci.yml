# GitHub Actions による CI
#
# - prek ジョブ: prek.toml のフック (fmt / clippy / tombi 等) を実行する
# - test ジョブ: cargo test --workspace を実行する (pre-push フックと同範囲)。
#   C4M の暗号実装は optional feature のため、aws-lc-rs feature の clippy / test / rustdoc も実行する
# - no-std-doc ジョブ: no_std ビルドと rustdoc の警告を検査する
# - runner:
#   - prek / test は workspace 全体を対象にするため macos-15 を使う。crates 配下の crate が
#     macOS 専用依存 (Video Toolbox / CoreAudio 系の shiguredo_*_device 等) を持ち、
#     Linux runner では workspace 全体をビルドできない (ubuntu-slim には Rust 自体がなく、
#     ubuntu-latest では shiguredo_audio_device のビルドスクリプトが失敗する)。
#     crates 配下の crate の単体テストは純粋なロジックのためヘッドレスでも実行できる
#   - no-std-doc は shiguredo_moqt のみを対象にするため crates 配下の crate の macOS 専用依存を
#     ビルドせず、ubuntu-latest を使う (ubuntu-slim には Rust が無い)
# - MSRV 検証は含めない。crates 配下の crate が rust-version 1.95 を要求するため
#   workspace 単位の 1.93 検証が構造的にできない
# - fuzz ターゲットの確認は CI では行わない (fuzz/ は独立 workspace のため
#   cargo test --workspace の対象外だが、必要なときにローカルで実行する)
# - issues/ 配下だけを変更した push / pull_request では workflow を起動しない。
#   issue ファイルはコードに影響せず、markdownlint はコミット時の prek フックで検査済みのため、
#   コードを変更しない issue 更新で macOS runner を消費しない

name: CI

on:
  # issues/ 配下だけの更新では CI を起動しない (paths-ignore)。
  # pull_request でも同じ条件を適用し、issue ファイルだけの PR では CI を走らせない
  push:
    branches:
      - develop
      - "feature/**"
    paths-ignore:
      - "issues/**"
  pull_request:
    paths-ignore:
      - "issues/**"

permissions:
  contents: read

jobs:
  prek:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust ツールチェーンのコンポーネントを追加する
        run: rustup component add rustfmt clippy
      - uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0

  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 全テストを実行する
        run: cargo test --workspace
      - name: aws-lc-rs feature の clippy を実行する
        run: cargo clippy -p shiguredo_moqt --all-targets --features aws-lc-rs -- -D warnings
      - name: aws-lc-rs feature のテストを実行する
        run: cargo test -p shiguredo_moqt --features aws-lc-rs
      - name: aws-lc-rs feature の rustdoc を検査する
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps -p shiguredo_moqt --features aws-lc-rs

  no-std-doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: thumbv7em-none-eabihf ターゲットを追加する
        run: rustup target add thumbv7em-none-eabihf
      - name: no_std ビルドを確認する
        run: cargo build -p shiguredo_moqt --target thumbv7em-none-eabihf
      - name: rustdoc の警告を検査する
        run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps -p shiguredo_moqt
