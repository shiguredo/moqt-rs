[package]
name = "moq-pub"
version = "2026.0.0"
edition = "2024"
# 依存の QUIC バックエンド (s2n-quic / tobi-quic) が MSRV 1.95 を要求するため、
# それに合わせる (raden の 1.94 要求も包含する)
rust-version = "1.95"
publish = false

[dependencies]
# 時雨堂クレート

# AV1 エンコーダ (libaom)
shiguredo_aom = "2026.3"
# 音声キャプチャ
shiguredo_audio_device = "2026.4"
# AV1 デコーダ (dav1d、MP4 再エンコード配信の入力デコード)
shiguredo_dav1d = "2026.3"
# HTTP/3 / WebTransport クライアント
shiguredo_http3 = "2026.1.0-canary.13"
# VP8 / VP9 エンコーダ・デコーダ (libvpx)。Windows は x86_64-pc-windows-msvc のみ対応する
shiguredo_libvpx = "2026.2.0-canary.3"
# MOQT 本体 (ローカル参照)
shiguredo_moqt = { path = "../../" }
# MP4 ファイルの demux (映像トラックのパススルー配信 / 再エンコード配信)
shiguredo_mp4 = "2026.6.0-canary.2"
# Opus エンコーダ
shiguredo_opus = "2026.4"
# カメラキャプチャ
shiguredo_video_device = "2026.4"

# crates 配下で共有するトランスポート crate (QUIC / WebTransport / QMux)
tokio-moq = { path = "../tokio-moq", default-features = false }

# 外部クレート

# バイト列操作
bytes = "1.12"
# CLI 引数パース
noargs = "0.4"
# 疑似キャプチャ用 2D ベクターグラフィックス
raden = "2026.2"
# 非同期ランタイム
tokio = { version = "1.54", features = ["full"] }
# Tokio タスクメトリクス計測
tokio-metrics = "0.5"
# 非同期ユーティリティ (graceful shutdown, rate limit, pool)
tokio-utils = "0.1"
# ログ出力
tracing = "0.1"
# ログのフィルタリングと購読
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "macos")'.dependencies]
# AAC-LC エンコーダ (Apple Audio Toolbox)
# 2026.1.0 は 1 回の AudioConverterFillComplexBuffer で同じパケットを再入力する不具合があり、
# 音声が重複するため、修正が入った canary を使う
shiguredo_audio_toolbox = "2026.2.0-canary.2"
# H.264 / H.265 ハードウェアエンコーダ (Apple Video Toolbox)
# 2026.1.1 は NV12 入力の UV プレーンの大きさをバイト数とピクセル数で比較する不具合があり、
# 必ず "plane copy dimensions exceed CVPixelBuffer plane bounds" で失敗するため、
# 修正が入った canary を使う
shiguredo_video_toolbox = "2026.2.0-canary.4"

[features]
default = ["quic-tobi"]
quic-ngtcp2 = ["tokio-moq/quic-ngtcp2"]
quic-s2n = ["tokio-moq/quic-s2n"]
# ネイティブ QUIC のバックエンド。ちょうど 1 つだけを有効にする。
quic-tobi = ["tokio-moq/quic-tobi"]
