[package]
name = "moq-pub"
version = "2026.0.0"
edition = "2024"
# 依存の tobi-quic が MSRV 1.95 を要求するため、それに合わせる (raden の 1.94 要求も包含する)
rust-version = "1.95"
description = "MOQT publisher client"
publish = false

[dependencies]
# 時雨堂クレート

# Happy Eyeballs v3 の設定値
happy-eyeballs = { path = "../happy-eyeballs" }
# 共有する codec デコーダ (AV1 / H.264 / H.265 / Opus)
moq-codec = { path = "../moq-codec" }
# 疑似キャプチャ用 2D ベクターグラフィックス
raden = "2026.2"
# AV1 エンコーダ (libaom)
shiguredo_aom = "2026.3"
# 音声キャプチャ
shiguredo_audio_device = "2026.4"
# AV1 デコーダのエラー型 (デコード処理は moq-codec、MP4 再エンコード配信の入力)
shiguredo_dav1d = "2026.3"
# VP8 / VP9 エンコーダ・デコーダ (libvpx)。Windows は x86_64-pc-windows-msvc のみ対応する
shiguredo_libvpx = "2026.2.0-canary.3"
# MOQT 本体 (ローカル参照)
shiguredo_moqt = { path = "../../" }
# MP4 ファイルの demux (映像トラックのパススルー配信 / 再エンコード配信)
shiguredo_mp4 = "2026.6.0-canary.2"
# Opus エンコーダ
shiguredo_opus = "2026.4"
# カメラキャプチャ
shiguredo_video_device = "2026.4"

# crates 配下で共有するトランスポート crate (QUIC / WebTransport / QMux)
tokio-moq = { path = "../tokio-moq" }

# 外部クレート

# バイト列操作
bytes = "1.12"
# CLI 引数パース
noargs = "0.4"
# 非同期ランタイム
tokio = { version = "1.54", features = ["full"] }
# Tokio タスクメトリクス計測
tokio-metrics = "0.5"
# 非同期ユーティリティ (graceful shutdown, rate limit, pool)
tokio-utils = "0.1"
# ログ出力
tracing = "0.1"
# ログのフィルタリングと購読
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# テストで WebTransport の終了コード (ErrorCode::AlpnError) を使う
shiguredo_http3 = "2026.1.0-canary.14"
# in-process の peer harness (実 QUIC 接続で peer 役を駆動する) を統合テストから使う
tokio-moq = { path = "../tokio-moq", features = ["test-support"] }

[target.'cfg(target_os = "macos")'.dependencies]
# AAC-LC エンコーダ (Apple Audio Toolbox)
# 2026.1.0 は 1 回の AudioConverterFillComplexBuffer で同じパケットを再入力する不具合があり、
# 音声が重複するため、修正が入った canary を使う
shiguredo_audio_toolbox = "2026.2.0-canary.2"
# H.264 / H.265 ハードウェアエンコーダ (Apple Video Toolbox)
# 2026.1.1 は NV12 入力の UV プレーンの大きさをバイト数とピクセル数で比較する不具合があり、
# 必ず "plane copy dimensions exceed CVPixelBuffer plane bounds" で失敗するため、
# 修正が入った canary を使う
shiguredo_video_toolbox = "2026.2.0-canary.4"
