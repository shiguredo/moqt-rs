[package]
name = "tokio-moq"
version = "2026.0.0"
edition = "2024"
# 依存の tobi-quic が MSRV 1.95 を要求するため、それに合わせる
rust-version = "1.95"
publish = false

[dependencies]
# 時雨堂クレート

# Happy Eyeballs v3 の Sans I/O スケジューラ
happy-eyeballs = { path = "../happy-eyeballs" }
# HTTP/2 / WebTransport over HTTP/2 クライアント
shiguredo_http2 = "2026.1.0-canary.17"
# HTTP/3 / WebTransport over HTTP/3 クライアント
shiguredo_http3 = "2026.1.0-canary.14"
# MOQT 本体 (ローカル参照)
shiguredo_moqt = { path = "../../" }
# QMux (draft-ietf-quic-qmux-02) の Sans I/O 実装
#
# qmux-rs は当面タグを打つ予定が無く、crates.io にも公開されていない (shiguredo_tokio_qmux は
# publish = false)。このためバージョンではなく git の rev で固定する。rev を上げるときは
# shiguredo_tokio_qmux と揃え、追随が必要な API 変更をまとめて反映する。
shiguredo_qmux = { git = "https://github.com/shiguredo/qmux-rs", rev = "aedb7001415a9387c6b01d25624316a4aad50521" }
# QMux の tokio ラッパー
shiguredo_tokio_qmux = { git = "https://github.com/shiguredo/qmux-rs", rev = "aedb7001415a9387c6b01d25624316a4aad50521" }
# QUIC 実装 (tobi-quic)。native QUIC と WebTransport over HTTP/3 の両方で使う
#
# crates.io に公開されていないため git で参照する。このリポジトリの main は
# 公開のたびに 1 コミットへ作り直される (履歴を積まない) ため、rev ではなく
# branch を指定する。
tobi_quic = { git = "https://github.com/shiguredo/tobi-quic", branch = "main" }
# 外部クレート

# Base64 デコード (MSF fragment の cat パラメータ)
base64ct = "1.8"
# バイト列操作
bytes = "1.12"
# テスト用 peer harness の自己署名証明書生成 (test-support feature で有効にする)
#
# peer_harness は `#[cfg(test)]` のビルドでは dev-dependencies の rcgen を使うが、
# 他クレートが `test-support` feature 経由で harness を使うビルドでは dev-dependencies が
# 解決されないため、同じ設定の任意依存を [dependencies] にも置く。
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs"], optional = true }
# TLS バックエンド (QUIC と WebTransport over HTTP/2 の rustls で使う)
rustls = "0.23"
# OS のシステムルートストアから TLS のルート証明書を読み込む (--cert 省略時の既定の検証)
rustls-native-certs = "0.8"
# 非同期ランタイム
tokio = { version = "1.54", features = ["full"] }
# Tokio タスクメトリクス計測
tokio-metrics = "0.5"
# TLS ストリームの Tokio 統合 (WebTransport over HTTP/2 の TCP+TLS)
tokio-rustls = "0.26"
# ログ出力
tracing = "0.1"

[dev-dependencies]
# 結合テスト用の自己署名証明書生成 (暗号バックエンドは aws-lc-rs)
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs"] }
# テストで tokio の時計を止める (start_paused / advance) ため test-util を有効にする。
# full は通常依存で有効なため、ここでは足りない feature だけを足す
tokio = { version = "1.54", features = ["test-util"] }

[features]
# in-process の peer harness (`peer_harness`) を他クレートへ公開する。
#
# `crates/moq-pub` / `crates/moq-sub` の `#[cfg(test)] mod tests` から参照するために使う。
# 既定 off であり、本 crate は publish = false のため、テスト専用モジュールの公開例外とする。
test-support = ["dep:rcgen"]
