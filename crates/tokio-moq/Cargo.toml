[package]
name = "tokio-moq"
version = "2026.0.0"
edition = "2024"
# 依存の QUIC バックエンド (s2n-quic / tobi-quic) が MSRV 1.95 を要求するため、それに合わせる
rust-version = "1.95"
publish = false

[dependencies]
# 時雨堂クレート

# HTTP/2 / WebTransport over HTTP/2 クライアント
shiguredo_http2 = "2026.1.0-canary.17"
# HTTP/3 / WebTransport over HTTP/3 クライアント
shiguredo_http3 = "2026.1.0-canary.14"
# MOQT 本体 (ローカル参照)
shiguredo_moqt = { path = "../../" }
# QUIC 実装 (ngtcp2)。quic-ngtcp2 feature で有効にする
shiguredo_ngtcp2_tokio = { version = "2026.1.0-canary.4", optional = true }
# QMux (draft-ietf-quic-qmux-02) の Sans I/O 実装
#
# qmux-rs は当面タグを打つ予定が無く、crates.io にも公開されていない (shiguredo_tokio_qmux は
# publish = false)。このためバージョンではなく git の rev で固定する。rev を上げるときは
# shiguredo_tokio_qmux と揃え、追随が必要な API 変更をまとめて反映する。
shiguredo_qmux = { git = "https://github.com/shiguredo/qmux-rs", rev = "aedb7001415a9387c6b01d25624316a4aad50521" }
# QMux の tokio ラッパー
shiguredo_tokio_qmux = { git = "https://github.com/shiguredo/qmux-rs", rev = "aedb7001415a9387c6b01d25624316a4aad50521" }
# QUIC 実装 (tobi-quic)
#
# crates.io に公開されていないため git で参照する。このリポジトリの main は
# 公開のたびに 1 コミットへ作り直される (履歴を積まない) ため、rev ではなく
# branch を指定する。ネイティブ QUIC のバックエンドと WebTransport over HTTP/3 の
# QUIC 層の両方で使うため、常に依存に含める。
tobi_quic = { git = "https://github.com/shiguredo/tobi-quic", branch = "main" }

# 外部クレート

# Base64 デコード (MSF fragment の c4m パラメータ)
base64ct = "1.8"
# バイト列操作
bytes = "1.12"
# TLS バックエンド (QUIC と WebTransport over HTTP/2 の rustls で使う)
rustls = "0.23"
# QUIC 実装 (s2n-quic)。quic-s2n feature で有効にする
s2n-quic = { version = "1.91", default-features = false, features = ["provider-address-token-default", "provider-tls-rustls", "unstable-provider-datagram"], optional = true }
# 非同期ランタイム
tokio = { version = "1.54", features = ["full"] }
# Tokio タスクメトリクス計測
tokio-metrics = "0.5"
# TLS ストリームの Tokio 統合 (WebTransport over HTTP/2 の TCP+TLS)
tokio-rustls = "0.26"
# ログ出力
tracing = "0.1"

[dev-dependencies]
# 結合テスト用の自己署名証明書生成 (暗号バックエンドは aws-lc-rs)
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs"] }
# テストで tokio の時計を止める (start_paused / advance) ため test-util を有効にする。
# full は通常依存で有効なため、ここでは足りない feature だけを足す
tokio = { version = "1.54", features = ["test-util"] }

[features]
default = ["quic-tobi"]
quic-ngtcp2 = ["dep:shiguredo_ngtcp2_tokio"]
quic-s2n = ["dep:s2n-quic"]
# ネイティブ QUIC のバックエンド。ちょうど 1 つだけを有効にする。
# WebTransport over HTTP/3 は tobi-quic を直接使うため、この選択の対象外である。
quic-tobi = []
